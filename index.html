<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="游戏攻略">
<meta name="theme-color" content="#10302d">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>游戏攻略合集</title>
<style>
:root {
  --primary: #1aa89a;
  --primary-dark: #0f7d73;
  --primary-light: #e3f6f3;
  --bg: #f4f8f8;
  --text: #24303a;
  --muted: #6b7a86;
  --border: #dde7e8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.7; font-size: 15px;
}
header {
  background: linear-gradient(135deg, #1aa89a 0%, #13877c 60%, #10302d 100%);
  color: #fff;
  padding: calc(48px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) 40px calc(24px + env(safe-area-inset-left));
}
header .inner, main { max-width: 1100px; margin: 0 auto; }
header h1 { margin: 0 0 6px; font-size: 32px; }
header p { margin: 0 0 20px; opacity: .9; }
#search {
  width: 100%; max-width: 420px; padding: 11px 16px; border-radius: 10px; border: none;
  font-size: 15px; outline: none; box-shadow: 0 4px 14px rgba(0,0,0,.15);
}
main { padding: 28px calc(24px + env(safe-area-inset-right)) calc(50px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left)); }
.count { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
.game {
  background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 18px;
  display: flex; flex-direction: column; text-decoration: none; color: inherit;
  transition: transform .15s, box-shadow .15s;
}
.game:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(16,48,45,.12); }
.game .top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.game .icon {
  width: 52px; height: 52px; border-radius: 12px; color: #fff; font-size: 24px; font-weight: bold;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.game h2 { margin: 0; font-size: 18px; line-height: 1.3; }
.game .en { color: var(--muted); font-size: 13px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.tag { background: var(--primary-light); color: var(--primary-dark); border-radius: 999px; padding: 1px 10px; font-size: 12px; }
.game .desc { font-size: 14px; color: #43525d; flex: 1; }
.game .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-size: 12px; color: var(--muted); }
.game .go { background: var(--primary); color: #fff; border-radius: 8px; padding: 6px 14px; font-size: 13px; font-weight: bold; }
.game.soon { border: 2px dashed #b8cfcc; background: transparent; align-items: center; justify-content: center; text-align: center; color: var(--muted); min-height: 190px; cursor: default; }
.game.soon:hover { transform: none; box-shadow: none; }
.game.soon .plus { font-size: 34px; line-height: 1; margin-bottom: 6px; color: #9cbcb8; }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }
footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 0 calc(24px + env(safe-area-inset-bottom)); }
@media (max-width: 560px) {
  header h1 { font-size: 26px; }
  header { padding-left: calc(16px + env(safe-area-inset-left)); padding-right: calc(16px + env(safe-area-inset-right)); }
  main { padding-left: calc(16px + env(safe-area-inset-left)); padding-right: calc(16px + env(safe-area-inset-right)); }
}
</style>
</head>
<body>
<header>
  <div class="inner">
    <h1>游戏攻略合集</h1>
    <p>选一个游戏进入攻略。所有页面都适配手机，可以在 Safari 里“添加到主屏幕”。</p>
    <input type="search" id="search" placeholder="搜索游戏名、英文名或标签…">
  </div>
</header>
<main>
  <div class="count" id="count"></div>
  <div class="grid" id="list"></div>
</main>
<footer>持续更新中</footer>

<script>
// 新增游戏：建一个子文件夹放攻略页，然后在这里加一行
const GAMES = [
  { name:"双点医院", en:"Two Point Hospital", path:"two-point-hospital/", color:"#1aa89a",
    tags:["模拟经营","本体 15 关","DLC"], desc:"布局、房间、疾病、配员、每关三星布局详解", updated:"2026-11" },
  { name:"熊与早餐", en:"Bear and Breakfast", path:"bear-and-breakfast/", color:"#c2703d",
    tags:["经营","建造","5 个度假村"], desc:"度假村分楼层布局、卧室家具清单、主线任务、食谱", updated:"2026-11" },
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(q) {
  q = q.trim().toLowerCase();
  const rows = GAMES.filter(g => !q || [g.name, g.en, g.desc, ...g.tags].join(" ").toLowerCase().includes(q));
  document.getElementById("count").textContent = `共 ${rows.length} 个游戏`;
  document.getElementById("list").innerHTML = rows.map(g => `
    <a class="game" href="${esc(g.path)}">
      <div class="top"><div class="icon" style="background:${esc(g.color)}">${esc(g.name[0])}</div>
        <div><h2>${esc(g.name)}</h2><div class="en">${esc(g.en)}</div></div></div>
      <div class="tags">${g.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      <div class="desc">${esc(g.desc)}</div>
      <div class="foot"><span>更新于 ${esc(g.updated)}</span><span class="go">进入攻略 →</span></div>
    </a>`).join("") + (q ? "" : `
    <div class="game soon"><div class="plus">+</div><b>更多游戏</b><div>敬请期待</div></div>`)
    + (q && !rows.length ? `<div class="empty">没有找到相关游戏</div>` : "");
}
document.getElementById("search").addEventListener("input", e => render(e.target.value));
render("");
</script>
</body>
</html>
